; UNBOXED 자동 등록 설정 파일
; 이 파일은 내 컴퓨터에만 두세요. 키가 들어가므로 다른 사람에게 보내거나 채팅에 붙여 넣지 마세요.

[api]
; 커머스API센터 > 애플리케이션 에서 받은 값
client_id = 여기에_클라이언트_ID
client_secret = 여기에_클라이언트_시크릿

[store]
; 처음에는 SUSPENSION(전시중지)으로 등록해서 판매자센터에서 확인한 뒤 전시로 바꾸세요.
default_display_status = SUSPENSION
delivery_company = HANJIN
delivery_fee = 3500
; 반품 배송비(편도) / 교환 배송비(왕복)
return_fee = 3500
exchange_fee = 7000
; 메뉴 3번(주소록)으로 확인한 번호
shipping_address_id =
return_address_id =
as_phone = 010-0000-0000
as_guide = A/S 및 문의는 네이버 톡톡으로 연락 주세요.
; 원산지 코드: 판매자센터 상품등록 화면의 원산지 값과 맞춰야 합니다. 첫 등록 오류 메시지를 보고 조정하세요.
origin_area_code = 04
origin_content = 상세페이지 참조
importer = 나이키코리아

[notice]
; 상품정보제공고시 공통 문구
manufacturer = 나이키
return_cost_reason = 상세페이지 참조
no_refund_reason = 상세페이지 참조
quality_assurance = 소비자분쟁해결기준에 따름
compensation = 상세페이지 참조
trouble_shooting = 상세페이지 참조
caution = 상세페이지 참조
warranty = 소비자분쟁해결기준에 따름
